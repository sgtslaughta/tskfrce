<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The app's round "@" logo in the v3 parent palette (parent-tokens.css): ink disc, lime @ -->
  <style>
    .disc { fill: #292928; }
    .at { fill: #c3f832; font: 700 44px 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
    @media (prefers-color-scheme: dark) {
      .disc { fill: #c3f832; }
      .at { fill: #1c1c1b; }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="31"/>
  <text class="at" x="32" y="33" text-anchor="middle" dominant-baseline="central">@</text>
</svg>
