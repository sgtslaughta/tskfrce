<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { --ink: #1d2b53; --sun: #ffc93c; --card: #ffffff; --line: #eef1f6; --green: #7bd389; }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e8eeff; --sun: #ffc93c; --card: #18213f; --line: #232f57; --green: #6fd08a; }
      }
      .bg { fill: var(--bg, #f4f7fa); }
      .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
      .text { font-family: Inter, sans-serif; fill: var(--ink); }
      .label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" class="bg"/>
  <defs>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(29,43,83,0.12)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="200" fill="url(#grid2)"/>

  <!-- Parent phone (left) -->
  <rect x="20" y="30" width="110" height="140" rx="8" class="card"/>
  <rect x="25" y="35" width="100" height="130" rx="6" fill="var(--bg, #f4f7fa)"/>
  <text x="75" y="55" class="label" text-anchor="middle" fill="var(--ink)" font-size="10">Needs you</text>

  <!-- Chore card in parent view -->
  <rect x="28" y="65" width="94" height="40" rx="4" class="card" stroke-width="1"/>
  <text x="32" y="77" class="text" font-size="10" font-weight="600">Walk the dog</text>
  <rect x="75" y="65" width="44" height="40" rx="3" fill="var(--sun)"/>
  <text x="97" y="85" class="label" text-anchor="middle" fill="#1d2b53" font-size="9">APPROVE</text>

  <!-- Arrow -->
  <path d="M 135 100 L 165 100" stroke="var(--sun)" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="var(--sun)" />
    </marker>
  </defs>

  <!-- Kid phone (right) -->
  <rect x="170" y="30" width="110" height="140" rx="8" class="card"/>
  <rect x="175" y="35" width="100" height="130" rx="6" fill="var(--green)"/>

  <!-- Status indicator -->
  <circle cx="225" cy="55" r="8" fill="var(--sun)"/>
  <text x="225" y="58" text-anchor="middle" font-size="16">✓</text>
  <text x="225" y="70" class="label" text-anchor="middle" fill="var(--ink)" font-size="9">Online!</text>

  <!-- Icon: WiFi connected -->
  <path d="M 215 85 Q 220 90 225 95 Q 230 90 235 85" stroke="var(--ink)" stroke-width="1.5" fill="none"/>
  <circle cx="225" cy="100" r="2" fill="var(--ink)"/>

  <!-- Labels -->
  <text x="75" y="185" class="label" text-anchor="middle" fill="var(--ink)" font-size="11">Parent approves</text>
  <text x="225" y="185" class="label" text-anchor="middle" fill="var(--ink)" font-size="11">Internet restored</text>
</svg>
