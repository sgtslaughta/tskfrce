<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root { --ink: #1d2b53; --sun: #ffc93c; --card: #ffffff; --line: #eef1f6; --shadow: 0 1px 2px rgba(29, 43, 83, 0.06), 0 6px 20px rgba(29, 43, 83, 0.08); }
      @media (prefers-color-scheme: dark) {
        :root { --ink: #e8eeff; --sun: #ffc93c; --card: #18213f; --line: #232f57; }
      }
      .bg { fill: var(--bg, #f4f7fa); }
      .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
      .text { font-family: Inter, sans-serif; fill: var(--ink); }
      .label { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; }
      .icon { font-size: 32px; }
    </style>
  </defs>

  <!-- Background with grid -->
  <rect width="300" height="200" class="bg"/>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(29,43,83,0.12)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="300" height="200" fill="url(#grid)"/>

  <!-- Phone frame -->
  <rect x="30" y="30" width="120" height="140" rx="8" class="card"/>
  <rect x="35" y="35" width="110" height="130" rx="6" fill="var(--bg, #f4f7fa)"/>

  <!-- Status bar -->
  <rect x="35" y="35" width="110" height="16" rx="4" fill="var(--card)"/>

  <!-- Chore list -->
  <circle cx="48" cy="60" r="3" fill="var(--ink)"/>
  <text x="55" y="63" class="text" font-size="11">Walk the dog</text>
  <text x="95" y="63" class="label" fill="var(--sun)" font-size="9">+15</text>

  <circle cx="48" cy="75" r="3" fill="var(--ink)"/>
  <text x="55" y="78" class="text" font-size="11">Do homework</text>
  <text x="92" y="78" class="label" fill="var(--sun)" font-size="9">+20</text>

  <circle cx="48" cy="90" r="3" fill="var(--ink)"/>
  <text x="55" y="93" class="text" font-size="11">Tidy room</text>
  <text x="95" y="93" class="label" fill="var(--sun)" font-size="9">+10</text>

  <!-- Button -->
  <rect x="38" y="110" width="50" height="20" rx="3" fill="var(--sun)" stroke="none"/>
  <text x="63" y="123" class="label" text-anchor="middle" fill="#1d2b53" font-size="10">DONE</text>

  <!-- Labels -->
  <text x="90" y="195" class="label" text-anchor="middle" fill="var(--ink)" font-size="12">Kid's home screen</text>
  <text x="90" y="210" class="text" text-anchor="middle" fill="var(--sub, #4a5a80)" font-size="10">Daily chores, point values</text>
</svg>
