name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Install dependencies
      run: |
        pip install -r backend/requirements.txt ruff
        cd frontend
        npm ci
    - name: Run linting
      run: |
        cd backend && ruff format --check . && ruff check .
        cd ../frontend
        npm run lint
        npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r backend/requirements.txt
    - name: Run test suite
      run: cd backend && python -m pytest tests -q

  installer:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Shellcheck
      run: shellcheck install.sh scripts/test-install.sh scripts/start.sh
    - name: Installer smoke test
      run: bash scripts/test-install.sh

  lab:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with: { python-version: '3.11' }
    - run: pip install pytest pyyaml
    - name: Enable IPv6 on Docker bridges
      run: |
        echo '{"ipv6": true, "fixed-cidr-v6": "fd00:d0c::/64"}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
    - name: Lab integration tests
      run: cd blocker && RUN_INTEGRATION=1 python -m pytest tests/lab -v
    - uses: actions/setup-node@v4
      with: { node-version: '18', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
    # the e2e container sits on the offline lab network; it uses these node_modules
    - run: cd frontend && npm ci
    - name: Browser e2e
      run: |
        bash scripts/lab.sh up
        bash scripts/lab.sh e2e
    - name: Upload e2e screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-artifacts
        path: frontend/e2e-artifacts
        if-no-files-found: ignore
    - name: Lab logs on failure
      if: failure()
      run: INTERNAL_TOKEN=labtoken docker compose -f lab/docker-compose.lab.yml logs --no-color
    - name: Lab teardown
      if: always()
      run: bash scripts/lab.sh down

  security-scan:
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Upload Trivy report as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
