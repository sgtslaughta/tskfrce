# Docker Compose configuration for TaaskMaaster
# Note: version attribute is obsolete in newer Docker Compose versions

# Environment variables with defaults
x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: taaskmaaster-backend
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8000}:8000"
    environment:
      <<: *common-env
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./taaskmaaster.db}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-change-in-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-taaskmaaster-media}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      DISABLE_RATE_LIMITING: ${DISABLE_RATE_LIMITING:-false}
      DISABLE_LOGIN_RATE_LIMIT: ${DISABLE_LOGIN_RATE_LIMIT:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.1.95:3000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,192.168.1.95,backend,taaskmaaster-backend}
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taaskmaaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Next.js Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
        - NODE_ENV=${NODE_ENV:-development}
    container_name: taaskmaaster-frontend
    ports:
      - "${FRONTEND_PORT:-0.0.0.0:3000}:3000"
    environment:
      <<: *common-env
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/proxy}  # Now points to internal proxy
      BACKEND_INTERNAL_URL: http://backend:8000  # Internal Docker network URL
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-TaaskMaaster}
      NODE_ENV: ${NODE_ENV:-development}
      # WebSocket and HMR configuration
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
      # Node.js memory optimization
      NODE_OPTIONS: "--max-old-space-size=2048 --max-semi-space-size=128"
    volumes:
      - ./frontend:/app
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taaskmaaster-network
    restart: unless-stopped
    # Memory limits to prevent SIGBUS errors
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: taaskmaaster-minio
    # MinIO ports not exposed externally - only accessible within the network
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - taaskmaaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Redis for caching and job queue
  redis:
    image: redis:7-alpine
    container_name: taaskmaaster-redis
    # Redis port not exposed externally - only accessible within the network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - taaskmaaster-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL (optional, for production)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: taaskmaaster-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_DB=taaskmaaster
  #     - POSTGRES_USER=taaskmaaster
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-taaskmaaster123}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - taaskmaaster-network
  #   restart: unless-stopped
  #   profiles:
  #     - production

volumes:
  backend_data:
  minio_data:
  redis_data:
  frontend_next_cache:  # Named volume for Next.js build cache
  # postgres_data:  # Commented out since postgres is disabled

networks:
  taaskmaaster-network:
    driver: bridge
    # Internal network - containers can communicate but external access is limited
    internal: false
    # Enable IPv6 support
    enable_ipv6: true
